# nginx site for SyRH. Installed by deploy/update.sh as /etc/nginx/sites-enabled/syrh.
# Port 8080: port 80 on the test server belongs to another application.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Scanned documents: up to the highest value of their size limit parameter (50 Mo).
    client_max_body_size 50m;

    # The built Vue application; unknown paths are client-side routes.
    root /srv/syrh/frontend/dist;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django: API and admin. The browser's Host header is kept so the CSRF
    # origin check sees one origin, as with the Vite proxy in development.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin's static files, gathered by collectstatic.
    location /static/ {
        alias /srv/syrh/backend/staticfiles/;
    }
}
